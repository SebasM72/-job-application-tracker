
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job - Job Application Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- Navigation -->
        <nav class="main-nav">
            <a href="{{ url_for('home') }}">Dashboard</a>
            <a href="{{ url_for('companies') }}">Companies</a>
            <a href="{{ url_for('jobs') }}">Jobs</a>
            <a href="/applications">Applications</a>
            <a href="/contacts">Contacts</a>
            <a href="/job-match">Job Match</a>
        </nav>

        <header>
            <h1>Edit Job</h1>
            <p>Update the information for this job listing.</p>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <section class="form-section">

            <h2>Job Information</h2>

            <form method="POST"
                  action="{{ url_for('edit_job', job_id=job.job_id) }}">

                <label>Company:</label>
                <select name="company_id" required>
                    {% for company in companies %}
                        <option
                            value="{{ company.company_id }}"
                            {% if company.company_id == job.company_id %}
                                selected
                            {% endif %}
                        >
                            {{ company.company_name }}
                        </option>
                    {% endfor %}
                </select>

                <label>Job Title:</label>
                <input
                    type="text"
                    name="job_title"
                    value="{{ job.job_title }}"
                    maxlength="100"
                    required
                >

                <label>Job Type:</label>
                <select name="job_type">
                    {% for type in ['Full-time', 'Part-time', 'Contract', 'Internship'] %}
                        <option
                            value="{{ type }}"
                            {% if job.job_type == type %}
                                selected
                            {% endif %}
                        >
                            {{ type }}
                        </option>
                    {% endfor %}
                </select>

                <label>Minimum Salary:</label>
                <input
                    type="number"
                    name="salary_min"
                    min="0"
                    step="0.01"
                    value="{{ job.salary_min if job.salary_min is not none else '' }}"
                >

                <label>Maximum Salary:</label>
                <input
                    type="number"
                    name="salary_max"
                    min="0"
                    step="0.01"
                    value="{{ job.salary_max if job.salary_max is not none else '' }}"
                >

                <label>Job Posting URL:</label>
                <input
                    type="url"
                    name="posting_url"
                    maxlength="500"
                    value="{{ job.posting_url or '' }}"
                >

                <label>Date Posted:</label>
                <input
                    type="date"
                    name="date_posted"
                    value="{{ job.date_posted or '' }}"
                >

                <label>Required Skills (comma-separated):</label>
                <input
                    type="text"
                    name="required_skills"
                    value="{{ job.required_skills_text }}"
                    placeholder="Python, SQL, AWS"
                >

                <button type="submit">Save Changes</button>

                <a href="{{ url_for('jobs') }}"
                   class="reset-button">
                    Cancel
                </a>

            </form>

        </section>

    </div>

</body>
</html>
